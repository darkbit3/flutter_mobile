workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project (creates ios/ folder)
        script: |
          flutter create --platforms=ios --project-name semeta --org com.semeta .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 | head -1 | xargs -I{} dirname {} | xargs -I{} sh -c 'cd {} && pod install'
      - name: Build unsigned iOS release
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa
          RUNNER_APP=$(find build/ios/iphoneos -name "*.app" | head -1)
          if [ -n "$RUNNER_APP" ]; then
            mkdir -p Payload
            cp -r "$RUNNER_APP" Payload/
            zip -r build/ios/ipa/Semeta-unsigned.ipa Payload
            rm -rf Payload
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
